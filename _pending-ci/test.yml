# Parked here on purpose: the publishing token lacks the `workflow` scope.
# Move to .github/workflows/test.yml once a token with workflow scope is available.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/site-slopcard.js --file examples/bad-site/index.html --out /tmp/out --fail-under 0
